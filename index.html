<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}</style>
<title>데스틴 1박 2일 동선</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 지도 라이브러리 최소 스타일 (직접 작성) */
.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-layer {
  position: absolute;
  left: 0;
  top: 0;
}
.leaflet-container {
  overflow: hidden;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
}
.leaflet-tile,
.leaflet-marker-icon {
  user-select: none;
}
.leaflet-container img.leaflet-tile {
  max-width: none !important;
  max-height: none !important;
  width: 256px;
  height: 256px;
}
.leaflet-tile { visibility: hidden; }
.leaflet-tile-loaded { visibility: inherit; }
.leaflet-pane { z-index: 400; }
.leaflet-tile-pane { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-marker-pane { z-index: 600; }
.leaflet-tooltip-pane { z-index: 650; }
.leaflet-popup-pane { z-index: 700; }
.leaflet-map-pane svg { max-width: none; }
.leaflet-interactive { cursor: pointer; }
.leaflet-zoom-anim .leaflet-zoom-animated {
  transition: transform 0.25s cubic-bezier(0, 0, 0.25, 1);
}
.leaflet-pan-anim .leaflet-tile,
.leaflet-zoom-anim .leaflet-tile { transition: none; }
.leaflet-fade-anim .leaflet-popup { opacity: 0; transition: opacity 0.2s linear; }
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup { opacity: 1; }
.leaflet-control-container .leaflet-top,
.leaflet-control-container .leaflet-bottom {
  position: absolute;
  z-index: 1000;
  pointer-events: none;
}
.leaflet-top { top: 0; }
.leaflet-bottom { bottom: 0; }
.leaflet-left { left: 0; }
.leaflet-right { right: 0; }
.leaflet-control {
  position: relative;
  z-index: 800;
  pointer-events: auto;
  float: left;
  clear: both;
}
.leaflet-right .leaflet-control { float: right; }
.leaflet-top .leaflet-control { margin-top: 10px; }
.leaflet-left .leaflet-control { margin-left: 10px; }
.leaflet-bar {
  border-radius: 6px;
  box-shadow: 0 1px 5px rgb(0 0 0 / 0.3);
}
.leaflet-bar a {
  display: block;
  width: 32px;
  height: 32px;
  line-height: 32px;
  text-align: center;
  text-decoration: none;
  font: bold 18px/32px sans-serif;
  background: var(--panel);
  color: var(--ink);
  border-bottom: 1px solid var(--line);
}
.leaflet-bar a:last-child { border-bottom: 0; }
.leaflet-control-attribution {
  font-size: 10px;
  padding: 0 5px;
  background: color-mix(in srgb, var(--panel) 80%, transparent);
  color: var(--muted);
  margin: 0;
}
.leaflet-control-attribution a { color: var(--gulf); }
.leaflet-popup {
  position: absolute;
  text-align: left;
  margin-bottom: 20px;
}
.leaflet-popup-content-wrapper {
  padding: 1px;
  border-radius: 10px;
  box-shadow: 0 3px 14px rgb(0 0 0 / 0.3);
}
.leaflet-popup-content { min-height: 1px; }
.leaflet-popup-tip-container {
  width: 40px;
  height: 20px;
  position: absolute;
  left: 50%;
  margin-top: -1px;
  margin-left: -20px;
  overflow: hidden;
  pointer-events: none;
}
.leaflet-popup-tip {
  width: 17px;
  height: 17px;
  padding: 1px;
  margin: -10px auto 0;
  transform: rotate(45deg);
}
.leaflet-container a.leaflet-popup-close-button {
  position: absolute;
  top: 0;
  right: 0;
  width: 24px;
  height: 24px;
  font: 16px/24px sans-serif;
  text-align: center;
  text-decoration: none;
  color: var(--muted);
}
.leaflet-tooltip {
  position: absolute;
  white-space: nowrap;
  pointer-events: none;
}

/* Layout: 좌측 스크롤 여정 패널 + 우측 고정 지도 (폰: 지도 위, 여정 아래) */
:root{
  --sand:#f6f1e7; --panel:#fffdf8; --ink:#1d2a2e; --muted:#5d6b6e; --line:#e3dccd;
  --gulf:#0f7c80; --gulf-soft:#d7efec; --sunset:#d9622b; --free:#2f8a4c; --paid:#c0392b;
  --land:#efe8d8; --road:#c9bfa9; --coast:#4aa3a6;
  --f-display:"Gowun Batang","Noto Serif KR",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sand:#12191b; --panel:#182225; --ink:#e8efee; --muted:#9fb0b1; --line:#2a3639;
  --gulf:#4cc2c0; --gulf-soft:#173a3b; --sunset:#f08a55; --free:#5cc47c; --paid:#ef6b5a;
  --land:#1b2427; --road:#3a4649; --coast:#3f9fa1; color-scheme:dark}}
:root[data-theme="dark"]{
  --sand:#12191b; --panel:#182225; --ink:#e8efee; --muted:#9fb0b1; --line:#2a3639;
  --gulf:#4cc2c0; --gulf-soft:#173a3b; --sunset:#f08a55; --free:#5cc47c; --paid:#ef6b5a;
  --land:#1b2427; --road:#3a4649; --coast:#3f9fa1; color-scheme:dark}
html,body{height:100%}
body{background:var(--sand);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.app{display:grid;grid-template-columns:minmax(340px,460px) 1fr;height:100%}
.side{overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);padding-block:20px 40px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:18px;min-width:0}
#map{height:100%;background:var(--land)}
h1{font-family:var(--f-display);font-size:1.6rem;line-height:1.25;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);font-size:.88rem;margin:0 0 14px}
.tabs{display:flex;gap:6px;position:sticky;top:-20px;background:var(--panel);padding:10px 0;z-index:5;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-weight:600;padding:6px 12px;border-radius:999px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--gulf);border-color:var(--gulf);color:var(--panel)}
.tab:focus-visible,.stop:focus-visible{outline:2px solid var(--sunset);outline-offset:2px}
.daynote{font-size:.85rem;color:var(--muted);margin:6px 0 10px}
.route-link{display:inline-block;font-size:.85rem;font-weight:600;color:var(--gulf);margin-bottom:8px}
.event{border:1px solid var(--sunset);border-radius:10px;padding:12px 14px;margin:10px 0 16px;background:color-mix(in srgb,var(--sunset) 8%,var(--panel))}
.event h3{margin:0 0 4px;font-size:.95rem;color:var(--sunset)}
.event p{margin:4px 0;font-size:.88rem}
.event ul{margin:6px 0 0;padding-left:18px;font-size:.86rem}
ol.stops{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.stop{display:grid;grid-template-columns:54px 1fr;gap:10px;padding:12px 8px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.stop:hover{background:var(--gulf-soft)}
.stop.active{background:var(--gulf-soft);border-color:var(--gulf)}
.time{font-variant-numeric:tabular-nums;font-weight:600;color:var(--gulf);font-size:.92rem;padding-top:2px}
.num{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--gulf);color:var(--panel);font-size:.75rem;font-weight:700;margin-top:4px}
.stop h2{font-size:1.02rem;margin:0;font-weight:600}
.tag{font-size:.74rem;color:var(--muted);letter-spacing:.02em}
.opt{font-size:.7rem;font-weight:700;color:var(--sunset);border:1px solid var(--sunset);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:2px}
.desc{margin:6px 0 4px;font-size:.9rem}
.park{font-size:.84rem;color:var(--muted);margin:4px 0}
.park b{color:var(--ink);font-weight:600}
.links{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:6px;font-size:.83rem}
.links a{color:var(--gulf);font-weight:500;text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--gulf) 40%,transparent)}
.yt::before{content:"▶ ";font-size:.7rem}
.legend{background:var(--panel);color:var(--ink);border-radius:10px;
  box-shadow:0 1px 6px rgb(0 0 0/.3);font-size:.8rem;min-width:0}
.legend summary{cursor:pointer;font-weight:600;padding:7px 12px;list-style:none;
  display:flex;align-items:center;gap:8px;user-select:none}
.legend summary::-webkit-details-marker{display:none}
.legend summary::after{content:"▾";color:var(--muted);transition:transform .15s}
.legend:not([open]) summary::after{transform:rotate(-90deg)}
.legend summary:focus-visible{outline:2px solid var(--sunset);outline-offset:2px;border-radius:10px}
.legend .rows{display:flex;flex-direction:column;gap:7px;padding:2px 12px 10px}
.legend .rows span{display:flex;align-items:center;gap:8px;color:var(--muted)}
.legend .rows i{flex:none}
.foot{font-size:.78rem;color:var(--muted);margin-top:18px;padding-top:12px;border-top:1px solid var(--line)}
/* markers */
.pin{display:grid;place-items:center;width:28px;height:28px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--gulf);border:2px solid var(--panel);box-shadow:0 1px 4px rgb(0 0 0/.35)}
.pin b{transform:rotate(45deg);color:var(--panel);font-size:.78rem}
.pin.on{background:var(--sunset)}
.pk{display:grid;place-items:center;width:20px;height:20px;border-radius:5px;font-weight:800;font-size:.72rem;color:#fff;border:1.5px solid var(--panel);box-shadow:0 1px 3px rgb(0 0 0/.35)}
.pk.free{background:var(--free)}.pk.paid{background:var(--paid)}
.ev{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--sunset);color:#fff;font-size:.9rem;border:2px solid var(--panel);box-shadow:0 0 0 4px color-mix(in srgb,var(--sunset) 35%,transparent)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--ink)}
.leaflet-popup-content{font-family:var(--f-body);font-size:.86rem;line-height:1.5;margin:12px 14px}
.pp h4{margin:0 0 4px;font-size:.95rem}
.pp .price{font-size:1.05rem;font-weight:700;font-variant-numeric:tabular-nums}
.pp .price.free{color:var(--free)}.pp .price.paid{color:var(--paid)}
.pp small{color:var(--muted);display:block;margin-top:4px}
.pp a{color:var(--gulf)}
.leaflet-container{font-family:var(--f-body);background:var(--land)}
.lbl{background:transparent;border:0;box-shadow:none;color:var(--muted);font-size:.7rem;font-weight:600}
.lbl::before{display:none}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:42vh auto;height:auto}
  #map{height:42vh;position:sticky;top:0;z-index:1;order:-1}
  .side{border-right:0;overflow:visible;padding-right:max(16px,env(safe-area-inset-right,0px));padding-left:max(16px,env(safe-area-inset-left,0px))}
  .tabs{top:42vh}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

    <h1>데스틴 1박 2일</h1>
    <p class="sub">11/27 (금, 블랙프라이데이) – 11/28 (토) · 어번 출발·귀가 · 일정을 누르면 지도에서 위치가 열립니다</p>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab1" aria-selected="true" data-day="1">1일차 · 금</button>
      <button class="tab" role="tab" id="tab2" aria-selected="false" data-day="2">2일차 · 토</button>
      <button class="tab" role="tab" id="tab3" aria-selected="false" data-day="0">전체</button>
    </div>
    <div id="list"></div>
    <p class="foot">주차 요금은 2026년 지역 가이드 기준이며 11월 비수기에는 바뀔 수 있습니다. 시 주차장은 QR 코드나 문자로 결제(Destin Park &amp; Play)하고 밤샘 주차는 금지입니다. 영상 설명은 각 유튜브 영상의 소개 내용을 요약했습니다.</p>
  </aside>
  <div id="map" role="application" aria-label="데스틴 일정 지도"></div>
</div>

    <li><a href="https://destinmiramar.com/events/harborwalk-santa-arrival-destin-2026/" target="_blank" rel="noopener">행사 안내 (Destin &amp; Miramar)</a></li>
   </ul>`},
 2:{title:"토요일 낮 HarborWalk: 산타 도착 퍼레이드 (11/28)",ll:[30.3936,-86.5118],
   body:`<p><b>Santa's Arrival on the Harbor</b> 12:30 산타가 배를 타고 도착, 보드워크 퍼레이드. 13–16시 산타 사진(무료 4x6 사진), 공연, 페이스 페인팅. 무료.</p>
   <p>일정상 아울렛 시간대와 겹칩니다. 아이가 있다면 제임스 리(선택 B) 대신 12시까지 HarborWalk에 들러 퍼레이드를 보고 아울렛으로 가는 방법도 있습니다(데커 파크에서 차로 약 15분, HarborWalk에서 아울렛까지 약 30분).</p>
   <p>Baytowne Wharf(샌데스틴) 산타 축제는 18–21시라 귀가 일정과 맞지 않습니다.</p>`},
};

const map = L.map("map",{zoomControl:false,attributionControl:true}).setView([30.388,-86.46],12);
L.control.zoom({position:"topright"}).addTo(map);
// 범례: 지도 왼쪽 위, 접기/펼치기 (상태는 이 브라우저에 기억)
const Legend = L.Control.extend({options:{position:"topleft"},onAdd(){
  const d = L.DomUtil.create("details","legend");
  let open = !matchMedia("(max-width:820px)").matches;
  try{ const s=localStorage.getItem("legendOpen"); if(s!==null) open = s==="1"; }catch(e){}
  d.open = open;
  d.innerHTML = `<summary>범례</summary><div class="rows">
    <span><i class="pin" style="width:18px;height:18px"><b style="font-size:.6rem">1</b></i>일정 순서</span>
    <span><i class="pk free">P</i>무료 주차</span>
    <span><i class="pk paid">P</i>유료 주차 (눌러서 요금)</span>
    <span><i class="ev">★</i>연휴 행사</span></div>`;
  d.addEventListener("toggle",()=>{ try{ localStorage.setItem("legendOpen", d.open?"1":"0"); }catch(e){} });
  L.DomEvent.disableClickPropagation(d); L.DomEvent.disableScrollPropagation(d);
  return d;
}});
new Legend().addTo(map);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
// 벡터 바탕(타일이 막힌 환경용): 해안선 + 주요 도로
const base = L.layerGroup().addTo(map);
function drawBase(){
  base.clearLayers();
  BASE.road.forEach(r=>L.polyline(r.g,{color:css("--road"),weight:r.k==="trunk"||r.k==="primary"?3:1.6,interactive:false}).addTo(base));
  BASE.coast.forEach(g=>L.polyline(g,{color:css("--coast"),weight:2.2,interactive:false}).addTo(base));
  [["Gulf of Mexico",[30.374,-86.47]],["Destin Harbor",[30.3925,-86.503]],["Choctawhatchee Bay",[30.405,-86.44]]].forEach(([n,ll])=>
    L.tooltip({permanent:true,direction:"center",className:"lbl"}).setLatLng(ll).setContent(n).addTo(base));
}
drawBase();
const tiles = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"});
let tileOk=false;
tiles.on("tileload",()=>{ if(!tileOk){tileOk=true; map.removeLayer(base);} });
tiles.addTo(map);

const stopLayer = L.layerGroup().addTo(map), routeLayer = L.layerGroup().addTo(map);
const pkLayer = L.layerGroup().addTo(map), evLayer = L.layerGroup().addTo(map);

PARKING.forEach(p=>{
  L.marker(p.ll,{icon:L.divIcon({className:"",html:`<i class="pk ${p.free?"free":"paid"}">P</i>`,iconSize:[20,20],iconAnchor:[10,10]}),zIndexOffset:-100,title:p.n})
   .bindPopup(`<div class="pp"><h4>${p.n}</h4><div class="price ${p.free?"free":"paid"}">${p.price}</div>${p.note?`<small>${p.note}</small>`:""}<small><a href="${gm(p.n+" Destin FL")}" target="_blank" rel="noopener">구글 지도에서 열기</a></small></div>`)
   .addTo(pkLayer);
});
Object.entries(EVENTS).forEach(([d,e])=>{
  L.marker(e.ll,{icon:L.divIcon({className:"",html:'<i class="ev">★</i>',iconSize:[26,26],iconAnchor:[13,13]}),zIndexOffset:500,title:e.title})
   .bindPopup(`<div class="pp"><h4>${e.title}</h4>${e.body}</div>`,{maxWidth:300}).addTo(evLayer);
});

const markers = [];
let curDay = 1;
function render(day){
  curDay = day;
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",String(+b.dataset.day===day)));
  stopLayer.clearLayers(); routeLayer.clearLayers(); markers.length=0;
  const list = document.getElementById("list"); list.innerHTML="";
  const days = day===0?[1,2]:[day];
  const bounds=[];
  days.forEach(d=>{
    const st = STOPS.filter(s=>s.day===d);
    if(day===0){ const h=document.createElement("h3"); h.textContent=d===1?"1일차 · 11/27 금":"2일차 · 11/28 토"; h.style.cssText="font-family:var(--f-display);margin:16px 0 4px"; list.appendChild(h); }
    const pts = st.map(s=>s.ll.join(","));
    const route = document.createElement("a"); route.className="route-link"; route.target="_blank"; route.rel="noopener";
    route.href="https://www.google.com/maps/dir/?api=1&travelmode=driving&destination="+encodeURIComponent(st[st.length-1].q)+"&waypoints="+encodeURIComponent(st.slice(0,-1).map(s=>s.q).join("|"));
    route.textContent = `${d}일차 전체 경로를 구글 지도 내비로 열기 →`; list.appendChild(route);
    if(EVENTS[d]){ const ev=document.createElement("div"); ev.className="event"; ev.innerHTML=`<h3>★ ${EVENTS[d].title}</h3>${EVENTS[d].body}`; list.appendChild(ev); }
    const ol=document.createElement("ol"); ol.className="stops"; list.appendChild(ol);
    L.polyline(st.map(s=>s.ll),{color:css("--gulf"),weight:3,dashArray:"6 7",opacity:.8,interactive:false}).addTo(routeLayer);
    st.forEach((s,i)=>{
      bounds.push(s.ll);
      const li=document.createElement("li"); li.className="stop"; li.tabIndex=0;
      li.innerHTML=`<div><div class="time">${s.t}</div><span class="num">${i+1}</span></div>
        <div style="min-width:0"><h2>${s.name}${s.opt?`<span class="opt">${s.opt}</span>`:""}</h2>
        <div class="tag">${s.en?s.en+" · ":""}${s.tag}</div>
        <p class="desc">${s.desc}</p>
        <p class="park">🅿 ${s.park}</p>
        <div class="links"><a href="${gm(s.q)}" target="_blank" rel="noopener">구글 지도</a>${s.vids.map(v=>`<a class="yt" href="${yt(v[1])}" target="_blank" rel="noopener">${v[0]}</a>`).join("")}</div></div>`;
      ol.appendChild(li);
      const m=L.marker(s.ll,{icon:L.divIcon({className:"",html:`<div class="pin"><b>${i+1}</b></div>`,iconSize:[28,28],iconAnchor:[14,28],popupAnchor:[0,-26]}),zIndexOffset:1000,title:s.name})
        .bindPopup(`<div class="pp"><h4>${s.t} · ${s.name}</h4><small>${s.tag}</small><small>🅿 ${s.park}</small><small><a href="${gm(s.q)}" target="_blank" rel="noopener">구글 지도에서 열기</a></small></div>`)
        .addTo(stopLayer);
      const focus=()=>{ document.querySelectorAll(".stop").forEach(x=>x.classList.remove("active")); li.classList.add("active");
        document.querySelectorAll(".pin").forEach(x=>x.classList.remove("on"));
        map.flyTo(s.ll,15,{duration:matchMedia("(prefers-reduced-motion: reduce)").matches?0:.8}); m.openPopup(); m.getElement()?.querySelector(".pin")?.classList.add("on"); };
      li.addEventListener("click",e=>{ if(e.target.closest("a")) return; focus(); });
      li.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();focus();} });
      m.on("click",()=>{ li.classList.add("active"); li.scrollIntoView({block:"nearest",behavior:"smooth"}); });
      markers.push(m);
    });
  });
  map.fitBounds(bounds,{padding:[30,30]});
}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>render(+b.dataset.day)));
// 오늘이 11/28 이후면 2일차로 시작
const now=new Date(); render(now.getMonth()===10 && now.getDate()>=28 ? 2 : 1);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{ if(!tileOk) drawBase(); render(curDay); });
setTimeout(()=>map.invalidateSize(),200);
</script>

</body></html>
